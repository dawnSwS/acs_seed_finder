[package]
name = "acs_seed_finder"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
default-run = "acs_seed_finder"

[features]
default = ["gui", "gpu"]
gui = [
    "dep:eframe", "dep:rfd", "dep:quick-xml", "dep:encoding_rs", "dep:aes",
    "dep:base64", "dep:serde", "dep:serde_json", "dep:pbkdf2", "dep:sha1",
]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:serde", "dep:serde_json"]

[dependencies]
rayon = "1.10.0"
# Keep the native GUI/rendering backends explicit. The app does not use
# eframe's optional AccessKit or browser speech-synthesis integrations.
eframe = { version = "0.27.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
wgpu = { version = "29.0.1", optional = true }
pollster = { version = "0.3.0", optional = true }
bytemuck = { version = "1.15.0", optional = true }
rfd = { version = "0.14", optional = true }
quick-xml = { version = "0.31.0", optional = true }
encoding_rs = { version = "0.8", optional = true }
aes = { version = "0.8.4", optional = true }
base64 = { version = "0.22.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"], optional = true }
sha1 = { version = "0.10", optional = true }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
indexing_slicing = "warn"
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
as_conversions = "warn"
undocumented_unsafe_blocks = "warn"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
cognitive_complexity = "warn"
collection_is_never_read = "warn"
redundant_clone = "warn"
suspicious_operation_groupings = "warn"
significant_drop_in_scrutinee = "warn"

[[bin]]
name = "acs_seed_finder"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
