[workspace]
resolver = "2"
members = ["crates/acs_core", "crates/acs_npc", "crates/acs_scanners", "crates/acs_app", "crates/pack_data"]

[workspace.dependencies]
rayon = "1.10.0"
eframe = "0.27.2"
wgpu = "29.0.1"
pollster = "0.3.0"
bytemuck = { version = "1.15.0", features = ["derive"] }
rfd = "0.14"
quick-xml = "0.31.0"
aes = "0.8.4"
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
flate2 = "1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"